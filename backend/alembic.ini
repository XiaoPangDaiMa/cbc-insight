# Alembic 配置（v1.8 起）。
#
# 为什么要有它：以前建表靠 init_db() 里的 create_all()，够用是因为只有一个开发库
# 且随时可以删。切到 Postgres 之后，库里有真实数据（账号、数据集、用户区间），
# 改一个列就得有"可重复执行、可回退"的迁移记录，否则只能删库重建。
#
# sqlalchemy.url 故意留空：真实 URL 由 backend/alembic/env.py 从 Settings 读，
# 这样 alembic 与后端的连接串永远只有一处来源（CBC_DATABASE_URL 或 backend/.env）。
[alembic]
script_location = alembic
# 留空 timezone 在 Windows 上会抛 ZoneInfo 报错，故给明确值
prepend_sys_path = .
timezone = UTC
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
