# 标准字段字典（SRS 3.3）
# 用途：把 3.3 的表格变成可执行的校验依据（DQ-01~DQ-06、FR-04、pandera schema）。
# 说明：3.3 原文把"类型/单位/合理值域/可空"写在同一张表里，这里逐列拆分，取值完全一致，
#       未新增任何数值。别名表另见 field_mapping.yaml（3.3 的"常见别名"列）。

required_fields:        # FR-02：至少 3 个血液指标才允许继续
  min_metrics: 3
  core_metrics: [hgb, wbc, plt]   # BR-03：三者全空的行删除
  fields: []                      # age/gender 缺失不算阻塞（A-01 降级）

fields:
  age:       { dtype: int,   unit: "岁",      domain: [0, 110],    nullable: false, name_cn: "年龄" }
  gender:    { dtype: enum,  unit: "",        domain: null,        nullable: true,  name_cn: "性别",
               enum: [male, female, unknown] }
  wbc:       { dtype: float, unit: "10^9/L",  domain: [0.1, 100],  nullable: true,  name_cn: "白细胞" }
  rbc:       { dtype: float, unit: "10^12/L", domain: [1.0, 8.0],  nullable: true,  name_cn: "红细胞" }
  hgb:       { dtype: float, unit: "g/L",     domain: [20, 250],   nullable: true,  name_cn: "血红蛋白" }
  hct:       { dtype: float, unit: "%",       domain: [10, 65],    nullable: true,  name_cn: "红细胞压积" }
  mcv:       { dtype: float, unit: "fL",      domain: [40, 140],   nullable: true,  name_cn: "平均红细胞体积" }
  mch:       { dtype: float, unit: "pg",      domain: [10, 50],    nullable: true,  name_cn: "平均红细胞血红蛋白量" }
  mchc:      { dtype: float, unit: "g/L",     domain: [200, 400],  nullable: true,  name_cn: "平均红细胞血红蛋白浓度" }
  rdw:       { dtype: float, unit: "%",       domain: [8, 35],     nullable: true,  name_cn: "红细胞分布宽度" }
  plt:       { dtype: float, unit: "10^9/L",  domain: [5, 1500],   nullable: true,  name_cn: "血小板" }
  mpv:       { dtype: float, unit: "fL",      domain: [4, 20],     nullable: true,  name_cn: "平均血小板体积" }
  neut_pct:  { dtype: float, unit: "%",       domain: [0, 100],    nullable: true,  name_cn: "中性粒细胞百分比" }
  lymph_pct: { dtype: float, unit: "%",       domain: [0, 100],    nullable: true,  name_cn: "淋巴细胞百分比" }
  mono_pct:  { dtype: float, unit: "%",       domain: [0, 100],    nullable: true,  name_cn: "单核细胞百分比" }
  eo_pct:    { dtype: float, unit: "%",       domain: [0, 100],    nullable: true,  name_cn: "嗜酸性粒细胞百分比" }
  baso_pct:  { dtype: float, unit: "%",       domain: [0, 100],    nullable: true,  name_cn: "嗜碱性粒细胞百分比" }

# 呈现顺序（前端指标卡、导出列顺序的唯一依据）
display_order:
  [hgb, rbc, wbc, plt, hct, mcv, mch, mchc, rdw, mpv,
   neut_pct, lymph_pct, mono_pct, eo_pct, baso_pct, age, gender]

# 小数位（SRS 4.4.6）
decimals:
  hgb: 0
  rbc: 2
  hct: 1
  mcv: 1
  mch: 1
  mchc: 0
  rdw: 1
  wbc: 2
  plt: 0
  mpv: 1
  neut_pct: 1
  lymph_pct: 1
  mono_pct: 1
  eo_pct: 1
  baso_pct: 1
  age: 0
