# 参考区间配置（SRS 3.5 / 附录 A）
# 依据：WS/T 405-2012《血细胞分析参考区间》
# 本文件是该数据在系统中的【唯一取值来源】，代码中禁止硬编码区间数值（NFR-M-03）。
# 修改本文件必须同步修改 version 号，历史判定结果按当时版本留存（7.3 决策 7）。
version: "2026.11.1"
source: "WS/T 405-2012"
applies_to: { min_age: 18, max_age: 120 }

default:
  wbc:      { low: 3.5,  high: 9.5,   unit: "10^9/L",  name_cn: "白细胞" }
  rbc:      { low: 4.3,  high: 5.8,   unit: "10^12/L", name_cn: "红细胞" }
  hgb:      { low: 130,  high: 175,   unit: "g/L",     name_cn: "血红蛋白" }
  hct:      { low: 40,   high: 50,    unit: "%",       name_cn: "红细胞压积" }
  mcv:      { low: 82,   high: 100,   unit: "fL",      name_cn: "平均红细胞体积" }
  mch:      { low: 27,   high: 34,    unit: "pg",      name_cn: "平均红细胞血红蛋白量" }
  mchc:     { low: 316,  high: 354,   unit: "g/L",     name_cn: "平均红细胞血红蛋白浓度" }
  rdw:      { low: 11.5, high: 14.5,  unit: "%",       name_cn: "红细胞分布宽度" }
  plt:      { low: 125,  high: 350,   unit: "10^9/L",  name_cn: "血小板" }
  mpv:      { low: 7,    high: 13,    unit: "fL",      name_cn: "平均血小板体积" }
  neut_pct: { low: 40,   high: 75,    unit: "%",       name_cn: "中性粒细胞百分比" }
  lymph_pct: { low: 20,  high: 50,    unit: "%",       name_cn: "淋巴细胞百分比" }
  # 以下三项不在 3.5 的示例片段中，但 3.3 字段字典与附录 A 均已收录，
  # 缺了它们 FR-30 的指标卡会少三张。取值来自附录 A，非自行设定。
  mono_pct: { low: 3,    high: 10,    unit: "%",       name_cn: "单核细胞百分比" }
  eo_pct:   { low: 0.4,  high: 8,     unit: "%",       name_cn: "嗜酸性粒细胞百分比" }
  baso_pct: { low: 0,    high: 1,     unit: "%",       name_cn: "嗜碱性粒细胞百分比" }

female_overrides:
  rbc: { low: 3.8, high: 5.1 }
  hgb: { low: 115, high: 150 }
  hct: { low: 35, high: 45 }
