# 清洗策略（SRS FR-05 / BR-03 / BR-04 / BR-05）
# 上传后自动执行，不需要用户点"开始清洗"（4.2.0 约定 2）。
strategy_id: "default-v1"

value_domain:            # ① 值域越界
  action: set_null       # 置空并计数；绝不删行
  log: true

missing:                 # ② 缺失
  column_drop_threshold: 0.30        # BR-03：缺失率 > 30% 整列剔除
  row_level:
    drop_if_core_all_null: true      # 核心字段 hgb/wbc/plt 全空 → 删行
  fill:
    method: group_median             # drop_row | median | group_median | none
    group_by: [gender, age_band]     # 分组中位数，逐级回退
    fallback: [gender, age_band]     # 分组取不到时用全表中位数

duplicates:              # ③ 重复（BR-04）
  action: keep_first
  subset: all

string_numbers:          # ④ 字符串数字 "12.3*" "<0.5"
  action: extract_number
  mark: true                      # 在 cleaning_log 里标记该行

logic_consistency:       # ⑤ 逻辑一致性（BR-05）
  formula: "hct_vs_rbc_mcv"
  tolerance: 0.15                 # |hct - rbc*mcv/10| / hct > 15% → hct 置空
  on_violation: set_null_hct

# 明令禁止：不得因统计离群（IQR / 3σ）删除任何行（FR-05「禁止」列、BR-06）
outlier_policy:
  delete_rows: false
  purpose: tag_only               # 离群只在 FR-16 打标签
