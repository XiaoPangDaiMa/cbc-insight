[project]
name = "cbc-insight-backend"
version = "0.1.0"
description = "血常规数据分析与可视化系统 — 后端（SRS: CBC-INSIGHT-SRS-001 v1.5）"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "pandera>=0.20",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "matplotlib>=3.8",
  "bcrypt>=4.1",
  "pyjwt>=2.8",
  "python-multipart>=0.0.9",
  "charset-normalizer>=3.3",
  "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: 需要真实 Postgres + Redis 的集成测试（docker compose up -d db redis）",
]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]

[tool.coverage.run]
source = ["app/pipeline", "app/services"]

