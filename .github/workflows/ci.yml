name: CI

# 触发时机：推送到 main、对任意分支开 PR、以及手动点一次
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支连续推送时，取消上一次还没跑完的任务，省额度也省等待
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: 后端 / ruff + pytest（含 80% 覆盖率门禁）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/requirements.txt

      - name: 创建虚拟环境
        run: uv venv --python 3.13

      - name: 安装依赖
        run: uv pip install --python .venv/bin/python -r requirements.txt

      - name: 代码风格（ruff）
        run: .venv/bin/python -m ruff check app tests alembic

      - name: 单元与接口测试
        # 只对 app/pipeline 与 app/services 设门禁：路由层由"每个接口三个用例"覆盖，
        # 硬刷百分比只会写出没有断言的空测试（SRS 10.2 的覆盖率口径）。
        run: >
          .venv/bin/python -m pytest -q
          --cov=app.pipeline --cov=app.services
          --cov-report=term-missing
          --cov-fail-under=80

      - name: 验证配色产物没有过期
        # tokens.json 改动后忘了跑 gen_theme.py，屏幕与报告图就会悄悄不一致（SRS RK-22 / T-32）
        run: .venv/bin/python ../scripts/gen_theme.py --check

  postgres:
    name: 后端 / Postgres 方言（模型与迁移能在真库上跑）
    runs-on: ubuntu-latest
    # SQLite 太宽容：它不校验 varchar 长度、把 json 当文本、布尔值存 0/1。
    # 这三条差异恰好是切库时最容易踩的，所以必须有一个真 Postgres 的 job。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cbc
          POSTGRES_PASSWORD: cbc_dev_password
          POSTGRES_DB: cbc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cbc"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CBC_DATABASE_URL: postgresql+psycopg://cbc:cbc_dev_password@127.0.0.1:5432/cbc
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 准备临时数据目录
        # runner 上下文在 job 级 env 里不可用（会报 Unrecognized named-value: 'runner'），
        # 只能在步骤里写进 GITHUB_ENV。测试会写 parquet 与报告，不该落进仓库。
        run: echo "CBC_DATA_DIR=$RUNNER_TEMP/cbc-data" >> "$GITHUB_ENV"

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/requirements.txt

      - name: 创建虚拟环境
        run: uv venv --python 3.13

      - name: 安装依赖
        run: uv pip install --python .venv/bin/python -r requirements.txt

      - name: 迁移到最新结构（alembic）
        run: .venv/bin/python -m alembic upgrade head

      - name: 结构没有漂移（模型与迁移一致）
        # autogenerate 出来是空的，说明没有人"改了模型忘了写迁移"
        run: .venv/bin/python -m alembic check

      - name: 在 Postgres 上跑全量测试
        run: .venv/bin/python -m pytest -q

  frontend:
    name: 前端 / typecheck + vitest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        # 构建脚本白名单在 pnpm-workspace.yaml 里（esbuild 必须放行），
        # 否则 pnpm 会以 ERR_PNPM_IGNORED_BUILDS 退出 1
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm run typecheck

      - name: 单元测试
        run: pnpm run test:unit

      - name: 生产构建
        run: pnpm run build
